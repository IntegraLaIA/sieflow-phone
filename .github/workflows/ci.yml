name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - run: npm test
      - name: Build the image
        run: docker build -t sieflow-phone:ci .
      - name: Smoke test the image in demo mode
        run: |
          docker run -d --name sieflow-phone-ci -p 8080:8080 -e DEMO_MODE=true sieflow-phone:ci
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -fsS http://127.0.0.1:8080/ | grep -q '<title>SieFlow Phone</title>'
          docker rm -f sieflow-phone-ci
