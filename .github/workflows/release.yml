name: release

# Push a tag like v0.1.0 (matching "version" in package.json) to publish:
#   - ghcr.io/integralaia/sieflow-phone:0.1.0, :0.1 and :latest (amd64 + arm64, with SBOM and provenance);
#     prereleases like v0.2.0-rc.1 never become :latest
#   - a GitHub release whose notes come from the matching sections of CHANGELOG.md (Spanish)
#     and CHANGELOG.en.md (English); the release fails if either one is missing
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
      - name: Tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm test

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=SieFlow Phone
            org.opencontainers.image.description=Self-hosted WhatsApp calls and chat for teams
            org.opencontainers.image.vendor=INTEGRALAIA SAS
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  github-release:
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Release notes from the changelogs (Spanish, then English)
        run: |
          version="${GITHUB_REF_NAME#v}"
          # The version's section, up to the next version or the link references.
          section() {
            awk -v v="$version" '
              $0 ~ "^## \\[" v "\\]" { on = 1; next }
              on && /^## \[/ { exit }
              on && /^\[[^]]+\]: / { exit }
              on { print }
            ' "$1"
          }
          for f in CHANGELOG.md CHANGELOG.en.md; do
            if [ -z "$(section "$f" | tr -d '[:space:]')" ]; then
              echo "::error file=$f::No section for $version in $f"
              exit 1
            fi
          done
          base="https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${version}"
          {
            section CHANGELOG.md
            echo
            echo "### Instalación"
            echo
            echo '```bash'
            echo "docker pull ${image}"
            echo '```'
            echo
            echo "Paso a paso (también para agentes de IA): [INSTALL-WITH-AI.md](${base}/INSTALL-WITH-AI.md)"
            echo
            echo "---"
            echo
            echo "## English"
            section CHANGELOG.en.md
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo "docker pull ${image}"
            echo '```'
            echo
            echo "Step by step (also for AI agents): [INSTALL-WITH-AI.en.md](${base}/INSTALL-WITH-AI.en.md)"
          } > notes.md
          cat notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$GITHUB_REF_NAME" in *-*) flags+=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" --title "SieFlow Phone ${GITHUB_REF_NAME#v}" --notes-file notes.md --verify-tag "${flags[@]}"
