name: release

# Two steps, so nothing ships without someone looking at it first:
#
# 1. Draft. Actions > release > Run workflow, with the version (for example 1.0.0).
#    It checks that the version matches package.json, runs the tests, builds the notes
#    from the matching sections of CHANGELOG.md (Spanish) and CHANGELOG.en.md (English)
#    and creates release vX.Y.Z as a DRAFT on that commit. It fails if either changelog
#    is missing the version or the release already exists.
# 2. Publish. Publishing the draft on GitHub creates the tag and runs this workflow
#    again, which builds and pushes ghcr.io/integralaia/sieflow-phone:X.Y.Z, :X.Y and
#    :latest (amd64 + arm64, with SBOM and provenance). Prereleases like v0.2.0-rc.1
#    never become :latest.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version without the v, the same as package.json (for example 1.0.0)'
        required: true
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Version matches package.json
        env:
          # The tag being published, or the version typed in when drafting.
          TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || format('v{0}', inputs.version) }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v$version" != "$TAG" ]; then
            echo "Version $TAG does not match package.json version $version" >&2
            exit 1
          fi
      - run: npm test

  image:
    needs: test
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            latest=auto
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=SieFlow Phone
            org.opencontainers.image.description=Self-hosted WhatsApp calls and chat for teams
            org.opencontainers.image.vendor=INTEGRALAIA SAS
            org.opencontainers.image.licenses=MIT
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  draft:
    needs: test
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: The release does not exist yet
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists (draft or published). Delete the draft or bump the version."
            exit 1
          fi
      - name: Release notes from the changelogs (Spanish, then English)
        run: |
          # The version's section, up to the next version or the link references.
          section() {
            awk -v v="$VERSION" '
              $0 ~ "^## \\[" v "\\]" { on = 1; next }
              on && /^## \[/ { exit }
              on && /^\[[^]]+\]: / { exit }
              on { print }
            ' "$1"
          }
          for f in CHANGELOG.md CHANGELOG.en.md; do
            if [ -z "$(section "$f" | tr -d '[:space:]')" ]; then
              echo "::error file=$f::No section for $VERSION in $f"
              exit 1
            fi
          done
          base="https://github.com/${GITHUB_REPOSITORY}/blob/v${VERSION}"
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION}"
          {
            section CHANGELOG.md
            echo
            echo "### Instalación"
            echo
            echo '```bash'
            echo "docker pull ${image}"
            echo '```'
            echo
            echo "Paso a paso (también para agentes de IA): [INSTALL-WITH-AI.md](${base}/INSTALL-WITH-AI.md)"
            echo
            echo "---"
            echo
            echo "## English"
            section CHANGELOG.en.md
            echo
            echo "### Install"
            echo
            echo '```bash'
            echo "docker pull ${image}"
            echo '```'
            echo
            echo "Step by step (also for AI agents): [INSTALL-WITH-AI.en.md](${base}/INSTALL-WITH-AI.en.md)"
          } > notes.md
          cat notes.md
      - name: Create the draft release
        run: |
          flags=()
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          # --target pins the tag that publishing will create to this exact commit.
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --draft --target "$GITHUB_SHA" \
            --title "SieFlow Phone $VERSION" --notes-file notes.md "${flags[@]}"
